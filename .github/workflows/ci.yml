name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A release is published only by a manual run on main.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

  bench:
    # The benchmark modules compile only with the `bench` feature, so no other
    # job compiles them. They do not run here: times on shared runners are
    # not stable.
    name: Bench feature lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (bench)
        run: cargo clippy --all-targets --features bench -- -D warnings

  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.current.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Get current version
        id: current
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::No version in the [package] section of Cargo.toml"
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    # Runs on every event as a dry run of the release builds. Only
    # publish-release makes a tag and a release from these archives.
    name: Build (${{ matrix.target }})
    needs: [test, bench, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin git-dag-parser
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          ARCHIVE="git-dag-parser-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          mkdir dist
          cp target/${{ matrix.target }}/release/git-dag-parser dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "git-dag-parser-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path dist
          Copy-Item "target\${{ matrix.target }}\release\git-dag-parser.exe" dist\
          Copy-Item "README.md" dist\
          Copy-Item "LICENSE" dist\
          Compress-Archive -Path "dist\*" -DestinationPath $archive
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: git-dag-parser-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  publish-release:
    name: Tag and publish release
    needs: [version, build-release]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Stop if the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ needs.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag ${{ needs.version.outputs.version }} exists. Change the version in Cargo.toml."
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ needs.version.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
