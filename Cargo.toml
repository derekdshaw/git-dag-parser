[package]
name = "git-dag-parser"
version = "0.1.0"
edition = "2021"
description = "Fast Git DAG parser that directly reads Git object store to build relationship graphs"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bars
indicatif = "0.17"

# Concurrency
crossbeam-channel = "0.5"
rayon = "1.10"

# Memory mapping
memmap2 = "0.9"

# Compression
flate2 = "1.0"

# Fast hashing
ahash = "0.8"
hashbrown = { version = "0.14", features = ["serde"] }

# CPU count
num_cpus = "1.17"

# CPU pinning (optional, for worker thread affinity)
core_affinity = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
