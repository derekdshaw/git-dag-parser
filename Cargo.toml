[workspace]
members = ["crates/git-dag-parser-core", "crates/test-fixtures"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[package]
name = "git-dag-parser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fast Git DAG parser that directly reads Git object store to build relationship graphs"
license.workspace = true

[dependencies]
# Parser library
git-dag-parser-core = { path = "crates/git-dag-parser-core" }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bars
indicatif = "0.17"

# Concurrency
rayon = "1.10"

# Global allocator of the binary (src/main.rs), and its options
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
test-fixtures = { path = "crates/test-fixtures" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
