[package]
name = "git-dag-parser"
version = "0.1.0"
edition = "2021"
description = "Fast Git DAG parser that directly reads Git object store to build relationship graphs"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bars
indicatif = "0.17"

# Concurrency
crossbeam-channel = "0.5"
rayon = "1.10"

# Memory mapping
memmap2 = "0.9"

# Compression
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }

# Fast hashing
ahash = "0.8"
hashbrown = { version = "0.14", features = ["serde"] }

# Path name interning
intaglio = { version = "1.15", default-features = false, features = ["bytes"] }

# CPU count
num_cpus = "1.17"

# CPU pinning (optional, for worker thread affinity)
core_affinity = "0.8"

# Benchmarks (`cargo bench --features bench`). A regular optional dependency,
# not a dev-dependency: the benchmarks live in the library next to the code
# they measure, and the library is not built in test mode for benches.
divan = { version = "0.1", optional = true }

[features]
bench = ["dep:divan"]

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "parser"
harness = false
required-features = ["bench"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
